worker_processes  1;

error_log  /opt/homebrew/etc/nginx/logs/error.log;
# error_log  /opt/homebrew/etc/nginx/logs/error.log  notice;
# error_log  /opt/homebrew/etc/nginx/logs/error.log  info;

pid        /opt/homebrew/etc/nginx/logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    # access_log  /opt/homebrew/etc/nginx/logs/access.log  main;

    sendfile        on;

    keepalive_timeout  65;

    #gzip  on;

    # Django
    server {
        listen       443 ssl default_server;

        ssl_certificate      "/opt/homebrew/etc/nginx/ssl/nginx.crt";
        ssl_certificate_key  "/opt/homebrew/etc/nginx/ssl/nginx.key";

        # Django Teamized Frontend Development Server
        location /__dev__/ {
            proxy_pass http://localhost:8081;
	        proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Django
        location / {
            proxy_pass http://localhost:8080;
	        proxy_set_header Host $host;
        }
    }

    # Angular
    server {
        listen       443 ssl;
        server_name  angular.local;

        ssl_certificate      "/opt/homebrew/etc/nginx/ssl/nginx.crt";
        ssl_certificate_key  "/opt/homebrew/etc/nginx/ssl/nginx.key";

        location / {
            proxy_pass http://localhost:4200;
	        proxy_set_header Host $host;
        }
    }

}
